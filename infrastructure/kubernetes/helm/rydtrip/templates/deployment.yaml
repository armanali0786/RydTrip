{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "rydtrip.labels" $ | nindent 4 }}
spec:
  # HPA-managed services start at their hpa.minReplicas and are then scaled
  # by the HPA controller, not by re-running `helm upgrade` — see hpa.yaml.
  replicas: {{ if $svc.hpa }}{{ $svc.hpa.minReplicas }}{{ else }}1{{ end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      {{- include "rydtrip.hostAliases" (list $ $svc.hostAliases) | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        # Every Dockerfile creates its `rydtrip` user identically (`adduser
        # -S`), which Alpine deterministically assigns uid 100 — verified
        # across all six images. Kubernetes' runAsNonRoot check needs a
        # numeric uid to verify against (it can't resolve a username from
        # the image without running it), which the Dockerfiles' `USER
        # rydtrip` (by name) doesn't give it on its own.
        runAsUser: 100
      containers:
        - name: {{ $name }}
          image: "rydtrip-{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ $svc.readOnlyRootFilesystem | default false }}
            capabilities:
              drop: ["ALL"]
          {{- if $svc.readOnlyRootFilesystem }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
          ports:
            - containerPort: {{ $svc.port }}
          env:
            - name: PORT
              value: {{ $svc.port | quote }}
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if $svc.useJwtSecret }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rydtrip-jwt-secret
                  key: JWT_SECRET
            {{- end }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
      {{- if $svc.readOnlyRootFilesystem }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
{{- end }}
