name: rydtrip

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rydtrip
      POSTGRES_PASSWORD: rydtrip
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rydtrip"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_HOST_PORT:-9094}:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: rydtrip
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_HOST_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      # Host port defaults to 6380, not 6379 — this dev machine already has a
      # local Redis on 6379 (same reasoning as Postgres's 5433 default).
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "${KAFKA_EXPORTER_HOST_PORT:-9308}:9308"
    depends_on:
      kafka:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "${REDIS_EXPORTER_HOST_PORT:-9121}:9121"
    depends_on:
      redis:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_HOST_PORT:-16686}:16686" # Web UI
      - "${JAEGER_OTLP_HTTP_HOST_PORT:-4318}:4318" # OTLP HTTP receiver — see OTEL_EXPORTER_OTLP_ENDPOINT below
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Container's own default (3000) collides with api-gateway's host mapping.
      - "${GRAFANA_HOST_PORT:-3300}:3000"
    depends_on:
      - prometheus

  rider-service:
    build:
      context: .
      dockerfile: services/rider-service/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://rydtrip:rydtrip@postgres:5432/rydtrip_riders
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-dev-shared-secret-change-me}
      JWT_EXPIRES_IN: 1d
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "${RIDER_HOST_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://rydtrip:rydtrip@postgres:5432/rydtrip_drivers
      JWT_SECRET: ${JWT_SECRET:-dev-shared-secret-change-me}
      JWT_EXPIRES_IN: 1d
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "${DRIVER_HOST_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  trip-service:
    build:
      context: .
      dockerfile: services/trip-service/Dockerfile
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://rydtrip:rydtrip@postgres:5432/rydtrip_trips
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "${TRIP_HOST_PORT:-3003}:3003"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  location-service:
    build:
      context: .
      dockerfile: services/location-service/Dockerfile
    environment:
      PORT: 3004
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      DRIVER_HEARTBEAT_TTL_SECONDS: 30
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "${LOCATION_HOST_PORT:-3004}:3004"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  dispatch-service:
    build:
      context: .
      dockerfile: services/dispatch-service/Dockerfile
    environment:
      PORT: 3005
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      DRIVER_SERVICE_URL: http://driver-service:3002
      RESERVATION_TTL_SECONDS: 30
      DISPATCH_SEARCH_RADIUS_KM: 5
      DISPATCH_CANDIDATE_LIMIT: 5
      DISPATCH_CIRCUIT_FAILURE_THRESHOLD: 5
      DISPATCH_CIRCUIT_RESET_TIMEOUT_MS: 10000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "${DISPATCH_HOST_PORT:-3005}:3005"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      PORT: 3000
      RIDER_SERVICE_URL: http://rider-service:3001
      DRIVER_SERVICE_URL: http://driver-service:3002
      TRIP_SERVICE_URL: http://trip-service:3003
      LOCATION_SERVICE_URL: http://location-service:3004
      JWT_SECRET: ${JWT_SECRET:-dev-shared-secret-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "${GATEWAY_HOST_PORT:-3000}:3000"
    depends_on:
      rider-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy
      trip-service:
        condition: service_healthy
      location-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
