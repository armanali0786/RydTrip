# Local-dev Prometheus config (Phase 10). Each RydTrip service exposes
# GET /metrics via @rydtrip/observability's MetricsModule; scraped by
# container DNS name over the docker-compose network.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:3000"]

  - job_name: rider-service
    static_configs:
      - targets: ["rider-service:3001"]

  - job_name: driver-service
    static_configs:
      - targets: ["driver-service:3002"]

  - job_name: trip-service
    static_configs:
      - targets: ["trip-service:3003"]

  - job_name: location-service
    static_configs:
      - targets: ["location-service:3004"]

  - job_name: dispatch-service
    static_configs:
      - targets: ["dispatch-service:3005"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
